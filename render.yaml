# Render Blueprint for Rakshak DevSecOps Platform
# Docs: https://render.com/docs/blueprint-spec

services:
  # ============================================================
  # 1. Rakshak Backend (FastAPI + Trivy + Gitleaks Docker Service)
  # ============================================================
  - type: web
    name: rakshak-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: RENDER
        value: "true"
      - key: RAKSHAK_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rakshak-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "true"
      - key: FRONTEND_URL
        value: "https://rakshak-frontend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://rakshak-frontend.onrender.com,http://localhost:5173"
      - key: FIREBASE_PROJECT_ID
        value: rakshak-auth
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        value: "https://rakshak-backend-22wr.onrender.com/api/auth/github/callback"
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

  # ============================================================
  # 2. Rakshak Frontend (React + TypeScript + Vite Static Site)
  # ============================================================
  - type: web
    name: rakshak-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://rakshak-backend-22wr.onrender.com"
      - key: VITE_FIREBASE_PROJECT_ID
        value: rakshak-auth
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: rakshak-auth.firebaseapp.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: rakshak-auth.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "822010235777"
      - key: VITE_FIREBASE_APP_ID
        value: "1:822010235777:web:799e42307656f26b35f680"
      - key: VITE_FIREBASE_MEASUREMENT_ID
        value: "G-MVEX9357QC"

# ============================================================
# 3. Rakshak Managed PostgreSQL Database
# Note: Render Free PostgreSQL expires after 30 days.
# For permanent production, a free Neon.tech or Supabase
# database connection string can be supplied in DATABASE_URL.
# ============================================================
databases:
  - name: rakshak-db
    databaseName: rakshak
    user: rakshak
    plan: free
    region: oregon
